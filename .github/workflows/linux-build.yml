name: Linux build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  TARGETS: WorldFullOfMeshes
  
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        configuration:
          - Release
          - Debug

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          python3-pip \
          wget \
          curl

    - name: Install Vulkan SDK
      run: |
        wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/lunarg.gpg
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk

    - name: Install Conan
      run: pip install conan

    - name: Compile Shaders
      run: |
        python3 Automation/automation.py compile_shaders --configuration ${{matrix.configuration}} 
      env:
        VULKAN_SDK: /usr

    - name: Install GCC 13
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.configuration}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.configuration}} --target ${{env.TARGETS}}

    - name: Upload Artifacts 
      uses: actions/upload-artifact@v4
      with:
          name: artifacts-${{matrix.configuration}}
          path: build/bin/*