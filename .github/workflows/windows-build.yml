name: Windows build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  TARGETS: VulkanEngine
  
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration:
          - Release
          - Debug

    steps:
    - uses: actions/checkout@v4

    - name: Install GLFW dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libxi-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          mesa-common-dev \
          libwayland-dev \
          wayland-protocols \
          wayland-scanner \
          libxkbcommon-dev
          
    - name: Install Conan
      run: pip install conan

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.configuration}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.configuration}} --target ${{env.TARGETS}}

    - name: Archive Artifacts
      run: Compress-Archive -Path build/bin/* -DestinationPath artifacts-${{matrix.configuration}}.zip

    - name: Upload Artifacts 
      uses: actions/upload-artifact@v4
      with:
         name: artifacts-${{matrix.configuration}}
         path: artifacts-${{matrix.configuration}}.zip
    
    
    
